name: Testar Academia Linux
on:
  push:
    branches: [main, qa-v2-interacoes-e2e]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check curriculum.js
          node --check conteudos-extra.js
          node --check portal.js
          node --check auth.js
          node --check auth-config.js
      - name: Testar estrutura e conteúdos
        run: node tests.mjs
      - name: Instalar dependência de teste DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Simular navegação e funcionalidades no navegador
        run: node smoke-test.mjs
